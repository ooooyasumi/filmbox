name: Source and core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-release.py
      - run: python3 scripts/audit-source.py
      - run: python3 scripts/check-public-suffix-source.py
      - run: go test ./...
        working-directory: CloudEngine
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift run FilmboxCoreChecks
      - run: swift build -c debug
      - run: ./scripts/check-timeline.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Android unit checks and debug build
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./Android/gradlew -p Android :app:testDebugUnitTest :app:assembleDebug
