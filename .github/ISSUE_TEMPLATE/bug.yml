name: 问题反馈
description: 报告可复现的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: 请先移除令牌、Cookie、密码、私人照片、完整文件路径和账号信息。云盘问题请注明提供商、网络条件及普通或会员账号。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [macOS, Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本、系统版本与设备处理器
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请说明本地或云端、操作顺序、实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的截图或诊断
      description: 请勿上传私人媒体、凭据、完整 catalog 或设备标识。
